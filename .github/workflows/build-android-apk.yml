name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ultraguard-resident-app/**"
      - ".github/workflows/build-android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ultraguard-resident-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Generate native android/ project
        run: npx expo prebuild --platform android

      - name: Build debug APK
        working-directory: ultraguard-resident-app/android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ultraguard-resident-debug-apk
          path: ultraguard-resident-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
