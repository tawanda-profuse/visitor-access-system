name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ultraguard-resident-app/**"
      - ".github/workflows/build-android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ultraguard-resident-app
    steps:
      # The build failed once with "No space left on device" compiling native modules
      # for all 4 ABIs — GitHub's standard runners have limited free disk, most of it
      # taken by preinstalled toolchains this workflow never uses.
      - name: Free up disk space
        working-directory: .
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /opt/hostedtoolcache/CodeQL "$AGENT_TOOLSDIRECTORY"
          df -h /

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Generate native android/ project
        run: npx expo prebuild --platform android

      - name: Build debug APK
        working-directory: ultraguard-resident-app/android
        # Debug builds compile native code (reanimated, svg, screens, etc.) for all 4
        # ABIs by default, ~4x the native compile time. arm64-v8a alone covers virtually
        # every real device sold since ~2018, which is what this APK is actually for.
        env:
          ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ultraguard-resident-debug-apk
          path: ultraguard-resident-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
