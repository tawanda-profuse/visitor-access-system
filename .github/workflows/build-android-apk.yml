name: Build Android APK

# Kept as a portfolio reference. The automatic push-to-main trigger is
# intentionally disabled so nothing runs from this public clone — run it
# manually from the Actions tab after wiring up your own AWS account and
# replacing the <PLACEHOLDER> values below.
on:
  workflow_dispatch:

permissions:
  id-token: write # required for OIDC -> AWS role assumption
  contents: read

env:
  AWS_REGION: "<AWS_REGION>" # e.g. us-east-1 — set to your bucket's region

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: resident-app
    steps:
      # The build failed once with "No space left on device" compiling native modules
      # for all 4 ABIs — GitHub's standard runners have limited free disk, most of it
      # taken by preinstalled toolchains this workflow never uses.
      - name: Free up disk space
        working-directory: .
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /opt/hostedtoolcache/CodeQL "$AGENT_TOOLSDIRECTORY"
          df -h /

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          # Not cache: gradle here — it hashes gradle wrapper files to build a cache
          # key, but those only exist after `expo prebuild` generates android/, which
          # hasn't run yet at this point in the job.

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Generate native android/ project
        run: npx expo prebuild --platform android

      - name: Build release APK
        working-directory: resident-app/android
        # A debug build doesn't embed the JS bundle — it loads it live from a Metro dev
        # server, which is why it demands a USB/Wi-Fi connection to a dev machine
        # regardless of API config. A release build embeds the JS bundle at build time
        # and only makes real HTTPS calls to whatever apiBaseUrl got baked into app.json,
        # with no Metro dependency. Expo's default template signs release builds with
        # the debug keystore unless a real release keystore is configured, which is
        # fine for sideloaded testing (not for a Play Store submission).
        #
        # Debug builds compile native code (reanimated, svg, screens, etc.) for all 4
        # ABIs by default, ~4x the native compile time. arm64-v8a alone covers virtually
        # every real device sold since ~2018, which is what this APK is actually for.
        env:
          ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a
        run: ./gradlew assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: resident-release-apk
          path: resident-app/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      # Publishes to a fixed object key that's always overwritten, so the public download
      # URL embedded in the resident invitation email never changes and always resolves
      # to whatever was built here last (see ANDROID_APK_URL in email-templates.ts).
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          # TODO: replace with the real role ARN once created (see
          # resident-app/infra/aws/apk-upload-trust-policy.json)
          role-to-assume: "arn:aws:iam::<AWS_ACCOUNT_ID>:role/github-actions-apk-upload"
          aws-region: ${{ env.AWS_REGION }}

      - name: Publish APK to public S3 bucket
        working-directory: resident-app/android/app/build/outputs/apk/release
        run: |
          aws s3 cp app-release.apk "s3://${{ vars.ANDROID_APK_BUCKET }}/securegate-resident-latest.apk"
